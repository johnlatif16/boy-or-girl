<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - تحديد جنس المولود</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .current-status {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .current-label {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .current-value {
            font-size: 48px;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            min-width: 200px;
        }

        .current-value.boy {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .current-value.girl {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .current-value.empty {
            background: #e0e0e0;
            color: #999;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .dashboard-btn {
            flex: 1;
            padding: 30px;
            font-size: 32px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .dashboard-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .dashboard-btn:active {
            transform: translateY(0);
        }

        .dashboard-btn.boy {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .dashboard-btn.girl {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .reset-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #ff5252;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .warning {
            background: #ff9800;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .dashboard-container {
                padding: 30px 20px;
            }
            .dashboard-btn {
                padding: 20px;
                font-size: 24px;
            }
            .current-value {
                font-size: 32px;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>📊 لوحة التحكم</h1>
        <p class="subtitle">اضغط على Boy أو Girl لإظهار النتيجة فوراً للجميع</p>

        <div id="successMessage" class="success-message"></div>

        <div class="current-status">
            <div class="current-label">الجنس المختار حالياً:</div>
            <div id="currentValue" class="current-value empty">لم يتم الاختيار</div>
        </div>

        <div class="buttons-container">
            <button class="dashboard-btn boy" id="setBoyBtn">👦 BOY</button>
            <button class="dashboard-btn girl" id="setGirlBtn">👧 GIRL</button>
        </div>

        <button class="reset-btn" id="resetBtn">🔄 إعادة تعيين (لبدء جديد)</button>
        
        <div class="warning">
            ⚠️ تحذير: عند اختيار الجنس، ستظهر النتيجة فوراً لكل المستخدمين في صفحة التخمين
        </div>
    </div>

    <script>
        const setBoyBtn = document.getElementById('setBoyBtn');
        const setGirlBtn = document.getElementById('setGirlBtn');
        const resetBtn = document.getElementById('resetBtn');
        const currentValueDiv = document.getElementById('currentValue');
        const successMessage = document.getElementById('successMessage');

        function showMessage(msg, isError = false) {
            successMessage.textContent = msg;
            successMessage.style.backgroundColor = isError ? '#f44336' : '#4caf50';
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }

        async function loadCurrentResult() {
            try {
                const response = await fetch('/api/result');
                const data = await response.json();
                
                if (data.showResult && data.gender) {
                    if (data.gender === 'Boy') {
                        currentValueDiv.innerHTML = '👦 BOY';
                        currentValueDiv.className = 'current-value boy';
                    } else {
                        currentValueDiv.innerHTML = '👧 GIRL';
                        currentValueDiv.className = 'current-value girl';
                    }
                } else {
                    currentValueDiv.innerHTML = 'لم يتم الاختيار';
                    currentValueDiv.className = 'current-value empty';
                }
            } catch (error) {
                console.error('Error loading result:', error);
            }
        }

        async function setGender(gender) {
            try {
                const response = await fetch('/api/set-result', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ gender: gender })
                });

                const result = await response.json();
                
                if (result.success) {
                    if (gender === 'Boy') {
                        currentValueDiv.innerHTML = '👦 BOY';
                        currentValueDiv.className = 'current-value boy';
                    } else {
                        currentValueDiv.innerHTML = '👧 GIRL';
                        currentValueDiv.className = 'current-value girl';
                    }
                    showMessage(`✅ تم إظهار النتيجة: ${gender === 'Boy' ? '👦 Boy' : '👧 Girl'} - ستظهر للجميع فوراً!`);
                } else {
                    showMessage('❌ حدث خطأ', true);
                }
            } catch (error) {
                console.error('Error setting gender:', error);
                showMessage('❌ حدث خطأ في الاتصال', true);
            }
        }

        async function resetGame() {
            if (confirm('⚠️ هل أنت متأكد؟ هذا سيخفي النتيجة الحالية وسيبدأ الجميع من جديد.')) {
                try {
                    const response = await fetch('/api/reset', {
                        method: 'POST'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        currentValueDiv.innerHTML = 'لم يتم الاختيار';
                        currentValueDiv.className = 'current-value empty';
                        showMessage('✅ تم إعادة التعيين! يمكنك اختيار جنس جديد.');
                    } else {
                        showMessage('❌ حدث خطأ', true);
                    }
                } catch (error) {
                    console.error('Error resetting:', error);
                    showMessage('❌ حدث خطأ', true);
                }
            }
        }

        setBoyBtn.addEventListener('click', () => setGender('Boy'));
        setGirlBtn.addEventListener('click', () => setGender('Girl'));
        resetBtn.addEventListener('click', resetGame);

        // تحديث كل 2 ثانية
        setInterval(loadCurrentResult, 2000);
        
        loadCurrentResult();
    </script>
</body>
</html>
