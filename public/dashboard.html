<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار جنس المولود</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .btn {
            font-size: 2em;
            padding: 30px 50px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }
        .btn-boy {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        .btn-boy:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
        }
        .btn-girl {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .btn-girl:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }
        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f0f0f0;
        }
        .success {
            background: #4caf50;
            color: white;
        }
        .error {
            background: #f44336;
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        .loading {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤰 اختاري جنس المولود 🤰</h1>
        <p>اضغطي على الزر لاختيار جنس البيبي</p>
        
        <div class="buttons">
            <button class="btn btn-boy" id="boyBtn" onclick="selectGender('boy')">
                👦 BOY 👦
            </button>
            <button class="btn btn-girl" id="girlBtn" onclick="selectGender('girl')">
                👧 GIRL 👧
            </button>
        </div>
        
        <div id="status" class="status">
            ⏳ لم يتم الاختيار بعد
        </div>
        
        <button class="back-btn" onclick="window.location.href='/index.html'">
            👈 عرض النتيجة
        </button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBsMTcIcg9c8mWXU112UEBWFmHiDXNQsBg",
            authDomain: "ramadan-39961.firebaseapp.com",
            projectId: "ramadan-39961",
            storageBucket: "ramadan-39961.firebasestorage.app",
            messagingSenderId: "40328788800",
            appId: "1:40328788800:web:8c48edf621cd00ebaf18a5",
            measurementId: "G-E0SCNXH3G4"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.selectGender = async function(gender) {
            const statusDiv = document.getElementById('status');
            const boyBtn = document.getElementById('boyBtn');
            const girlBtn = document.getElementById('girlBtn');
            
            // تعطيل الأزرار مؤقتاً
            boyBtn.disabled = true;
            girlBtn.disabled = true;
            boyBtn.classList.add('loading');
            girlBtn.classList.add('loading');
            
            statusDiv.innerHTML = '⏳ جاري الحفظ...';
            statusDiv.className = 'status';
            
            try {
                await setDoc(doc(db, "babyChoice", "current"), {
                    gender: gender,
                    timestamp: serverTimestamp()
                });
                
                statusDiv.innerHTML = `✅ تم الاختيار: ${gender === 'boy' ? 'ولد 👦' : 'بنت 👧'} ✅`;
                statusDiv.className = 'status success';
                
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1500);
            } catch (error) {
                console.error("Error:", error);
                statusDiv.innerHTML = '❌ حدث خطأ، حاولي مرة أخرى ❌';
                statusDiv.className = 'status error';
                
                // إعادة تفعيل الأزرار
                boyBtn.disabled = false;
                girlBtn.disabled = false;
                boyBtn.classList.remove('loading');
                girlBtn.classList.remove('loading');
            }
        };
    </script>
</body>
</html>
