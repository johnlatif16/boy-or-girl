<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار نوع الجنين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .baby-emoji {
            font-size: 80px;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0;
            transition: all 0.5s ease;
        }

        .result-text {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        .gender-icon {
            font-size: 60px;
            margin: 15px 0;
        }

        .boy-color {
            color: #4A90E2;
        }

        .girl-color {
            color: #E85D75;
        }

        .reset-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .connection-status {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
            color: #666;
        }

        .connected {
            color: #28a745;
        }

        .disconnected {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤰 اختيار نوع الجنين</h1>
        <div class="baby-emoji">👶</div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">جاري التحميل...</p>
        </div>

        <div class="error" id="error"></div>

        <div id="resultContent"></div>

        <button class="reset-btn" onclick="resetChoice()">🔄 اختيار مرة أخرى</button>
        
        <div class="connection-status" id="connectionStatus">
            <span id="statusText">جاري الاتصال...</span>
        </div>
    </div>

    <script>
        let db = null;
        let choiceRef = null;
        let unsubscribe = null;

        async function initializeFirebase() {
            try {
                // Fetch config from server
                const response = await fetch('/api/config');
                const firebaseConfig = await response.json();
                
                if (firebaseConfig.apiKey && firebaseConfig.projectId) {
                    // Initialize Firebase
                    const firebaseApp = firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();
                    choiceRef = db.collection('babyChoices').doc('currentChoice');
                    
                    // Update connection status
                    document.getElementById('statusText').innerHTML = '✅ متصل بـ Firebase';
                    document.getElementById('statusText').className = 'connected';
                    
                    // Listen for real-time updates
                    unsubscribe = choiceRef.onSnapshot((doc) => {
                        console.log('تم استلام تحديث من Firebase');
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.choice) {
                                displayResult(data.choice);
                            } else {
                                showWaitingMessage();
                            }
                        } else {
                            showWaitingMessage();
                        }
                    }, (error) => {
                        console.error('Firestore error:', error);
                        showError('حدث خطأ في الاتصال بقاعدة البيانات');
                        document.getElementById('statusText').innerHTML = '⚠️ غير متصل';
                        document.getElementById('statusText').className = 'disconnected';
                    });
                } else {
                    // Fallback to localStorage for demo
                    document.getElementById('statusText').innerHTML = '⚠️ وضع تجريبي (localStorage)';
                    document.getElementById('statusText').className = 'disconnected';
                    const savedChoice = localStorage.getItem('babyGender');
                    if (savedChoice) {
                        displayResult(savedChoice);
                    } else {
                        showWaitingMessage();
                    }
                    
                    // Listen for storage events
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'babyGender') {
                            if (e.newValue) {
                                displayResult(e.newValue);
                            } else {
                                showWaitingMessage();
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Init error:', error);
                // Fallback to localStorage
                document.getElementById('statusText').innerHTML = '⚠️ وضع تجريبي (localStorage)';
                document.getElementById('statusText').className = 'disconnected';
                const savedChoice = localStorage.getItem('babyGender');
                if (savedChoice) {
                    displayResult(savedChoice);
                } else {
                    showWaitingMessage();
                }
            }
        }

        function showWaitingMessage() {
            const resultDiv = document.getElementById('resultContent');
            resultDiv.innerHTML = `
                <div class="result-box">
                    <p style="font-size: 18px;">✨ في انتظار اختيار اختي... ✨</p>
                    <div class="gender-icon">⏳</div>
                    <p style="font-size: 14px; margin-top: 10px;">ستختار اختي قريباً لنعرف نوع الجنين! 💝</p>
                </div>
            `;
        }

        function displayResult(choice) {
            const resultDiv = document.getElementById('resultContent');
            const isBoy = choice === 'boy';
            const genderText = isBoy ? 'ولد' : 'بنت';
            const genderIcon = isBoy ? '👦' : '👧';
            const colorClass = isBoy ? 'boy-color' : 'girl-color';
            const bgGradient = isBoy 
                ? 'linear-gradient(135deg, #4A90E2 0%, #357ABD 100%)' 
                : 'linear-gradient(135deg, #E85D75 0%, #D9445C 100%)';

            resultDiv.innerHTML = `
                <div class="result-box" style="background: ${bgGradient}">
                    <p style="font-size:20px;">🥳 مبروك اختي 🥳</p>
                    <div class="gender-icon ${colorClass}">${genderIcon}</div>
                    <div class="result-text">الجنين ${genderText}</div>
                    <p style="margin-top:15px;">💝 الله يتمملك على خير 💝</p>
                </div>
            `;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        async function resetChoice() {
            if (db && choiceRef && unsubscribe) {
                try {
                    await choiceRef.delete();
                    showWaitingMessage();
                    showError('تم مسح الاختيار! يمكن لاختك الاختيار مرة أخرى');
                } catch (error) {
                    console.error('Reset error:', error);
                    localStorage.removeItem('babyGender');
                    showWaitingMessage();
                }
            } else {
                localStorage.removeItem('babyGender');
                showWaitingMessage();
                showError('تم مسح الاختيار (وضع تجريبي)');
            }
        }

        // Load Firebase SDK
        const script = document.createElement('script');
        script.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        script.onload = () => {
            const firestoreScript = document.createElement('script');
            firestoreScript.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
            firestoreScript.onload = initializeFirebase;
            document.head.appendChild(firestoreScript);
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
