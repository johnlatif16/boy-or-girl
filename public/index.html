<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جنس المولود</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .result {
            font-size: 3em;
            margin: 30px 0;
            padding: 20px;
            border-radius: 15px;
            background: #f0f0f0;
        }
        .boy {
            background: #4facfe;
            color: white;
        }
        .girl {
            background: #f093fb;
            color: white;
        }
        .pending {
            background: #ffd93d;
            color: #333;
        }
        .message {
            margin-top: 20px;
            color: #666;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ جنس المولود الجديد ✨</h1>
        <div id="result" class="result pending">
            ⏳ جاري التحميل...
        </div>
        <div class="message" id="message"></div>
        <button onclick="window.location.href='/dashboard.html'">
            🎯 اختيار الجنس
        </button>
    </div>

    <script>
        async function loadChoice() {
            try {
                const response = await fetch('/api/choice');
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                const messageDiv = document.getElementById('message');
                
                if (data.gender === 'boy') {
                    resultDiv.innerHTML = '👦 ولد 👦';
                    resultDiv.className = 'result boy';
                    messageDiv.innerHTML = '🎉 ألف مبروك! رزقكم الله بالغلام الصالح 🎉';
                } else if (data.gender === 'girl') {
                    resultDiv.innerHTML = '👧 بنت 👧';
                    resultDiv.className = 'result girl';
                    messageDiv.innerHTML = '🎉 ألف مبروك! رزقكم الله بالبنت الصالحة 🎉';
                } else {
                    resultDiv.innerHTML = '❓ لم يتم الاختيار بعد ❓';
                    resultDiv.className = 'result pending';
                    messageDiv.innerHTML = '📝 يرجى اختيار جنس المولود من لوحة التحكم';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = '⚠️ خطأ في الاتصال';
            }
        }
        
        loadChoice();
        // Auto-refresh every 5 seconds
        setInterval(loadChoice, 5000);
    </script>
</body>
</html>
