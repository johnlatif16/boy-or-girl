<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار نوع الجنين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .baby-emoji {
            font-size: 80px;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0;
            transition: all 0.5s ease;
        }

        .result-text {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        .gender-icon {
            font-size: 60px;
            margin: 15px 0;
        }

        .boy-color {
            color: #4A90E2;
        }

        .girl-color {
            color: #E85D75;
        }

        .message {
            font-size: 18px;
            color: #666;
            margin: 20px 0;
        }

        .reset-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .update-badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }

        .counter {
            font-size: 14px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤰 اختيار نوع الجنين</h1>
        <div class="baby-emoji">👶</div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">جاري التحميل...</p>
        </div>

        <div class="error" id="error"></div>

        <div id="resultContent"></div>

        <button class="reset-btn" onclick="resetChoice()">🔄 اختيار مرة أخرى</button>
        
        <div class="counter" id="counter">
            تحديث تلقائي كل 3 ثواني ⏱️
        </div>
    </div>

    <script>
        let intervalId = null;
        let currentChoice = null;

        // دالة لجلب الاختيار من localStorage
        function fetchChoice() {
            const savedChoice = localStorage.getItem('babyGender');
            
            if (savedChoice && savedChoice !== currentChoice) {
                currentChoice = savedChoice;
                displayResult(currentChoice);
                showUpdateNotification();
            } else if (!savedChoice && currentChoice !== null) {
                currentChoice = null;
                showWaitingMessage();
            } else if (!savedChoice) {
                showWaitingMessage();
            }
        }

        // دالة لعرض إشعار التحديث
        function showUpdateNotification() {
            const counterDiv = document.getElementById('counter');
            const originalText = counterDiv.innerHTML;
            counterDiv.innerHTML = '🔄 تم التحديث! 🔄';
            counterDiv.style.animation = 'pulse 0.5s';
            counterDiv.style.color = '#28a745';
            counterDiv.style.fontWeight = 'bold';
            
            setTimeout(() => {
                counterDiv.innerHTML = originalText;
                counterDiv.style.animation = '';
                counterDiv.style.color = '#999';
                counterDiv.style.fontWeight = 'normal';
            }, 2000);
        }

        // دالة لعرض رسالة الانتظار
        function showWaitingMessage() {
            const resultDiv = document.getElementById('resultContent');
            resultDiv.innerHTML = `
                <div class="result-box">
                    <p style="font-size: 18px;">✨ في انتظار الاختيار... ✨</p>
                    <div class="gender-icon">⏳</div>
                    <div class="update-badge">🔄 تنتظر التحديث...</div>
                </div>
            `;
        }

        // دالة لعرض النتيجة
        function displayResult(choice) {
            const resultDiv = document.getElementById('resultContent');
            const isBoy = choice === 'boy';
            const genderText = isBoy ? 'ولد' : 'بنت';
            const genderIcon = isBoy ? '👦' : '👧';
            const colorClass = isBoy ? 'boy-color' : 'girl-color';
            const bgGradient = isBoy 
                ? 'linear-gradient(135deg, #4A90E2 0%, #357ABD 100%)' 
                : 'linear-gradient(135deg, #E85D75 0%, #D9445C 100%)';

            // تأثير اهتزاز خفيف عند التحديث
            resultDiv.style.animation = 'none';
            resultDiv.offsetHeight; // إعادة تعيين الأنيميشن
            resultDiv.style.animation = 'fadeIn 0.5s ease-in';
            
            resultDiv.innerHTML = `
                <div class="result-box" style="background: ${bgGradient}; animation: fadeIn 0.5s;">
                    <p style="font-size: 20px;">🥳 مبروك اختي 🥳</p>
                    <div class="gender-icon ${colorClass}">${genderIcon}</div>
                    <div class="result-text">الجنين ${genderText}</div>
                    <div class="update-badge">✅ تم تحديث الاختيار</div>
                </div>
            `;
        }

        // دالة لعرض الخطأ
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // دالة لإعادة تعيين الاختيار
        async function resetChoice() {
            try {
                localStorage.removeItem('babyGender');
                currentChoice = null;
                showWaitingMessage();
                showError('تم إعادة تعيين الاختيار! يمكن لاختك الاختيار مرة أخرى');
                
                // إرسال إشارة إلى dashboard إذا كان مفتوحاً (اختياري)
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'babyGender',
                    newValue: null,
                    oldValue: 'boy' // or whatever was there
                }));
            } catch (error) {
                console.error('Reset error:', error);
                showError('حدث خطأ في إعادة التعيين');
            }
        }

        // بدء التحديث التلقائي
        function startAutoUpdate() {
            if (intervalId) {
                clearInterval(intervalId);
            }
            
            // تنفيذ أول مرة فوراً
            fetchChoice();
            
            // ثم كل 3 ثواني
            intervalId = setInterval(() => {
                console.log('جاري تحديث البيانات...', new Date().toLocaleTimeString());
                fetchChoice();
            }, 3000); // 3000 ميلي ثانية = 3 ثواني
        }

        // الاستماع للتغيرات من tabs أخرى (للتحديث الفوري)
        window.addEventListener('storage', (event) => {
            if (event.key === 'babyGender') {
                console.log('تم اكتشاف تغيير من علامة تبويب أخرى:', event.newValue);
                setTimeout(() => {
                    fetchChoice();
                }, 100);
            }
        });

        // عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            startAutoUpdate();
            
            // إضافة مؤشر أن التحديث التلقائي يعمل
            const counterDiv = document.getElementById('counter');
            setInterval(() => {
                if (counterDiv.innerHTML.includes('تم التحديث')) return;
                const seconds = Math.floor((Date.now() / 1000) % 60);
                counterDiv.innerHTML = `🔄 تحديث تلقائي كل 3 ثواني | آخر تحديث: ${new Date().toLocaleTimeString()}`;
            }, 1000);
        });

        // تنظيف الـ Interval عند مغادرة الصفحة (اختياري)
        window.addEventListener('beforeunload', () => {
            if (intervalId) {
                clearInterval(intervalId);
            }
        });

        // دالة للتحقق من الاتصال (اختياري)
        function checkConnection() {
            if (!navigator.onLine) {
                showError('⚠️ لا يوجد اتصال بالإنترنت! سيتم استخدام البيانات المخزنة محلياً');
            }
        }
        
        window.addEventListener('online', () => {
            showError('✅ تم استعادة الاتصال بالإنترنت');
            fetchChoice();
        });
        
        window.addEventListener('offline', () => {
            showError('⚠️ انقطع الاتصال بالإنترنت! سيتم استخدام البيانات المخزنة');
        });
        
        checkConnection();
    </script>
</body>
</html>
